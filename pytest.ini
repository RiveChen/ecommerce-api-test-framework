# pytest.ini

[pytest]

; 测试发现
testpaths  = tests
python_files    = test_*.py
python_classes  = Test*
python_functions = test_*

; 默认命令行参数 —— 每次 uv run pytest 都自动带上这些
addopts =
    --alluredir=allure-results
    -v
    --tb=short

; 在终端实时输出日志
log_cli         = true
log_cli_level   = INFO
log_cli_format  = %(asctime)s  %(levelname)-8s  %(message)s

; 提前声明自定义 marker，否则 pytest 会报 PytestUnknownMarkWarning
markers =
    smoke:    冒烟测试，核心路径快速验证
    slow:     含等待或性能压测的用例
    auth:     鉴权模块
    products: 商品模块
    users:    用户模块